services:
  mongodb:
    image: mongo:latest
    container_name: comic_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: comic_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: comic_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build: ./auth-service
    container_name: comic_auth_service
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
  comic-service:
    build: ./comic-service
    container_name: comic_comic_service
    ports:
      - "3002:3002"
    depends_on:
      - mongodb

volumes:
  mongodb_data: