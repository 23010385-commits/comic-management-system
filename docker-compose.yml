services:
  mongodb:
    image: mongo:latest
    container_name: comic_mongodb
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  redis:
    image: redis:latest
    container_name: comic_redis
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management
    container_name: comic_rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"

  auth-service:
    build: ./auth-service
    container_name: comic_auth_service
    ports:
      - "3001:3001"
    depends_on:
      - mongodb
  comic-service:
    build: ./comic-service
    container_name: comic_comic_service
    ports:
      - "3002:3002"
    depends_on:
      - mongodb
  chapter-service:
    build: ./chapter-service
    container_name: comic_chapter_service
    ports:
      - "3003:3003"
    depends_on:
      - mongodb
  api-gateway:
    build: ./api-gateway
    container_name: comic_api_gateway
    ports:
      - "3000:3000"
    depends_on:
      - auth-service
      - comic-service
      - chapter-service

volumes:
  mongodb_data: